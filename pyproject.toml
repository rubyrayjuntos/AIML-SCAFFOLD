[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ml-workflow"
version = "0.1.0"
description = "Azure-first, config-driven ML workflow reference architecture"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2==3.1.6",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml==6.0.3",
  "databricks-sdk>=0.38,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
aiml-scaffold = "aiml_scaffold.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]
ml = [
  "mlflow>=2.14,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["aiml_scaffold.templates.azure_ml_batch.scripts.__pycache__"]

[tool.setuptools.package-data]
aiml_scaffold = [
  "templates/azure_ml_batch/*",
  "templates/azure_ml_batch/.azure/*",
  "templates/azure_ml_batch/.github/workflows/*",
  "templates/azure_ml_batch/config/*",
  "templates/azure_ml_batch/data/*",
  "templates/azure_ml_batch/data-science/environment/*",
  "templates/azure_ml_batch/data-science/src/*",
  "templates/azure_ml_batch/.gitignore",
  "templates/azure_ml_batch/infra/terraform/*",
  "templates/azure_ml_batch/infra/terraform/.terraform.lock.hcl",
  "templates/azure_ml_batch/mlops/azureml/train/*",
  "templates/azure_ml_batch/mlops/azureml/deploy/batch/*",
  "templates/azure_ml_batch/mlops/azureml/deploy/batch/code/*",
  "templates/azure_ml_batch/platform/*",
  "templates/azure_ml_batch/scripts/*.py",
  "templates/azure_ml_batch/tests/*.py",
]

[tool.setuptools.exclude-package-data]
aiml_scaffold = [
  "templates/azure_ml_batch/scripts/__pycache__/*",
  "templates/**/__pycache__/*",
  "templates/**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

name: Validate deferred reference assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain R1 boundary
        run: >-
          echo "This workflow performs validation only. R1 generation and live acceptance
          use the generated repository Terraform and Azure ML batch workflows."
      - name: Build experimental Bicep reference
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/bicep/main.bicep
      - name: Validate deferred Databricks bundle when CLI is available
        run: |
          if command -v databricks >/dev/null 2>&1; then
            DATABRICKS_BUNDLE_ROOT=databricks databricks bundle validate -t dev
          else
            echo "Databricks CLI unavailable; Databricks is outside R1."
          fi

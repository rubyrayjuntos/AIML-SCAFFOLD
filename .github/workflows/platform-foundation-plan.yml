name: Platform foundation plan
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan infra/platform_foundation against
        required: true
        type: choice
        options: [dev, prod]
        default: dev
permissions:
  id-token: write
  contents: read
jobs:
  plan:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RUN_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.0"
      - name: Initialize
        run: terraform -chdir=infra/platform_foundation init -backend-config="backend-${RUN_ENVIRONMENT}.hcl"
      - name: Capture pre-plan backend state identity
        run: terraform -chdir=infra/platform_foundation state pull > "${RUNNER_TEMP}/pre-plan-state.json" || echo '{}' > "${RUNNER_TEMP}/pre-plan-state.json"
      - name: Plan
        run: |
          mkdir -p "${RUNNER_TEMP}/plan-artifact"
          terraform -chdir=infra/platform_foundation plan -var-file="${RUN_ENVIRONMENT}.tfvars" -out="${RUNNER_TEMP}/plan-artifact/plan.tfplan"
          terraform -chdir=infra/platform_foundation show -json "${RUNNER_TEMP}/plan-artifact/plan.tfplan" > "${RUNNER_TEMP}/plan.raw.json"
      - id: approval
        name: Create and verify immutable review artifact
        run: |
          python infra/platform_foundation/scripts/plan_artifact.py create \
            --artifact-dir "${RUNNER_TEMP}/plan-artifact" \
            --terraform-dir infra/platform_foundation \
            --plan "${RUNNER_TEMP}/plan-artifact/plan.tfplan" \
            --raw-json "${RUNNER_TEMP}/plan.raw.json" \
            --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actor "$GITHUB_ACTOR" \
            --environment "$RUN_ENVIRONMENT" \
            --state-snapshot "${RUNNER_TEMP}/pre-plan-state.json"
          plan_digest="$(cut -d ' ' -f 1 "${RUNNER_TEMP}/plan-artifact/plan.tfplan.sha256")"
          json_digest="$(cut -d ' ' -f 1 "${RUNNER_TEMP}/plan-artifact/plan.sanitized.json.sha256")"
          {
            echo "### Platform foundation plan approval contract"
            echo "- Environment: \`$RUN_ENVIRONMENT\`"
            echo "- Plan digest: \`$plan_digest\`"
            echo "- Sanitized JSON digest: \`$json_digest\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Run ID: \`$GITHUB_RUN_ID\`, attempt: \`$GITHUB_RUN_ATTEMPT\`"
            echo "- Apply requires a separate manual dispatch of platform-foundation-apply.yml with this run ID, attempt, and digest."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish reviewed-plan candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-foundation-plan-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

name: Platform foundation apply
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply infra/platform_foundation against
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      plan_run_id:
        description: Run ID of the reviewed platform-foundation-plan workflow
        required: true
        type: string
      plan_run_attempt:
        description: Run attempt containing the reviewed plan artifact
        required: true
        default: "1"
        type: string
      reviewed_plan_digest:
        description: Exact sha256 digest printed by the reviewed plan workflow
        required: true
        type: string
      reviewed_json_digest:
        description: Exact sha256 digest of the reviewed sanitized plan JSON
        required: true
        type: string
      approval_reason:
        description: Human-readable reason for authorizing this exact plan
        required: true
        type: string
      confirm_environment:
        description: Type APPLY_DEV or APPLY_PROD to authorize this environment
        required: true
        type: string
permissions:
  id-token: write
  contents: read
  actions: read
jobs:
  apply:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RUN_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Verify manual authorization
        env:
          CONFIRM_ENVIRONMENT: ${{ inputs.confirm_environment }}
          AUTHORIZED_ACTORS: ${{ vars.APPLY_AUTHORIZED_ACTORS }}
        run: |
          expected="APPLY_$(echo "$RUN_ENVIRONMENT" | tr '[:lower:]' '[:upper:]')"
          test "$CONFIRM_ENVIRONMENT" = "$expected"
          python3 - <<'PY'
          import os
          actors = {value.strip().lower() for value in os.environ["AUTHORIZED_ACTORS"].split(",") if value.strip()}
          if not actors or os.environ["GITHUB_ACTOR"].lower() not in actors:
              raise SystemExit("apply actor is not authorized for this environment")
          PY
      - name: Download the reviewed plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: platform-foundation-plan-${{ inputs.environment }}-${{ inputs.plan_run_id }}-${{ inputs.plan_run_attempt }}
          path: ${{ runner.temp }}/approved-plan
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - id: approval
        name: Verify the plan artifact matches the reviewed digest
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
          REVIEWED_PLAN_DIGEST: ${{ inputs.reviewed_plan_digest }}
          REVIEWED_JSON_DIGEST: ${{ inputs.reviewed_json_digest }}
        run: |
          python infra/platform_foundation/scripts/plan_artifact.py verify \
            --artifact-dir "${RUNNER_TEMP}/approved-plan" \
            --run-id "$PLAN_RUN_ID" \
            --run-attempt "$PLAN_RUN_ATTEMPT" \
            --environment "$RUN_ENVIRONMENT" \
            --plan-digest "$REVIEWED_PLAN_DIGEST" \
            --json-digest "$REVIEWED_JSON_DIGEST" \
            --github-output
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.0"
      - run: terraform -chdir=infra/platform_foundation init -backend-config="backend-${RUN_ENVIRONMENT}.hcl"
      - name: Verify backend state has not changed since plan
        # No fallback here either - see the matching comment in
        # platform-foundation-plan.yml. A state pull failure at apply time is
        # even more consequential to mask, since this step exists specifically
        # to catch drift between the reviewed plan and the real backend before
        # applying against it.
        run: |
          terraform -chdir=infra/platform_foundation state pull > "${RUNNER_TEMP}/current-state.json"
          python infra/platform_foundation/scripts/plan_artifact.py verify \
            --artifact-dir "${RUNNER_TEMP}/approved-plan" \
            --run-id "${{ inputs.plan_run_id }}" \
            --run-attempt "${{ inputs.plan_run_attempt }}" \
            --environment "$RUN_ENVIRONMENT" \
            --plan-digest "${{ inputs.reviewed_plan_digest }}" \
            --json-digest "${{ inputs.reviewed_json_digest }}" \
            --current-state-snapshot "${RUNNER_TEMP}/current-state.json"
          rm -f "${RUNNER_TEMP}/current-state.json"
      - name: Record pre-apply authorization evidence
        env:
          APPROVAL_REASON: ${{ inputs.approval_reason }}
          PLAN_DIGEST: ${{ steps.approval.outputs.plan_digest }}
          PLAN_REQUESTED_BY: ${{ steps.approval.outputs.plan_requested_by }}
        run: |
          {
            echo "### Digest-bound manual authorization"
            echo "- Environment: \`$RUN_ENVIRONMENT\`"
            echo "- Plan digest: \`$PLAN_DIGEST\`"
            echo "- Plan requested by: \`$PLAN_REQUESTED_BY\`"
            echo "- Apply authorized by: \`$GITHUB_ACTOR\`"
            echo "- Approval reason: $APPROVAL_REASON"
            echo "- Control: separate manual dispatch applying the reviewed artifact without replanning"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: apply
        name: Apply reviewed plan
        continue-on-error: true
        run: terraform -chdir=infra/platform_foundation apply -auto-approve "${RUNNER_TEMP}/approved-plan/plan.tfplan"
      - name: Record apply outcome
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          echo "### Apply outcome: \`${APPLY_OUTCOME}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail unsuccessful apply
        if: steps.apply.outcome != 'success'
        run: exit 1

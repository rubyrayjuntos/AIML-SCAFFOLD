name: Platform foundation OIDC smoke
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to prove the factory OIDC credential against
        required: true
        type: choice
        options: [dev, prod]
        default: dev
permissions:
  id-token: write
  contents: read
jobs:
  read-only-proof:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: identity
        name: Verify exchanged-token identity without printing the token
        env:
          EXPECTED_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          EXPECTED_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          az account get-access-token --query accessToken -o tsv | python3 -c '
          import base64, json, os, sys
          token = sys.stdin.read().strip()
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          expected = {
              "appid": os.environ["EXPECTED_CLIENT_ID"].lower(),
              "tid": os.environ["EXPECTED_TENANT_ID"].lower(),
          }
          actual = {key: str(claims.get(key, "")).lower() for key in expected}
          if actual != expected:
              raise SystemExit("exchanged token identity does not match the factory deployment principal")
          print("OIDC token identity matched the factory client and tenant IDs.")
          '
      - name: Prove a harmless read against a platform_foundation resource
        if: inputs.environment == 'dev'
        run: |
          az group show --name "rg-aiml-platform-foundation-dev" --query '{id:id,location:location}' -o json
          az storage blob list \
            --auth-mode login \
            --account-name "stazmlops0001devtf" \
            --container-name "aiml-platform-foundation" \
            --num-results 1 \
            --query 'length(@)' -o tsv >/dev/null
          echo "Dedicated platform-foundation resource-group and state-container reads succeeded."
        # Only dev has real resources to read against right now (prod is
        # scaffolded, not exercised) - safe to gate on the choice input's
        # value directly since workflow_dispatch constrains it to dev|prod.
      - name: Prove management-plane denial outside the factory's own scope
        run: |
          if az group show --name "rg-azure-ai-ml-ops-dev" --only-show-errors >/dev/null 2>&1; then
            echo "Factory deployment identity unexpectedly has management-plane visibility into the generated project's resource group." >&2
            exit 1
          fi
          echo "Out-of-scope generated-project resource-group read was denied as expected."
      - name: Record nonmutating evidence summary
        env:
          RUN_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "### Platform foundation OIDC read-only proof"
            echo "- Environment: \`$RUN_ENVIRONMENT\`"
            echo "- Token exchange: exercised"
            echo "- Token identity match (factory client/tenant): passed"
            if [ "$RUN_ENVIRONMENT" = "dev" ]; then
              echo "- platform-foundation resource-group read: passed"
              echo "- platform-foundation state-container read: passed"
            fi
            echo "- Out-of-scope generated-project resource-group read: denied"
            echo "- Terraform mutation: not exercised"
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Check documentation changelog convention
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          base_ref="$BASE_REF"
          if git rev-parse --verify --quiet "origin/${base_ref}" >/dev/null; then
            added=$(git diff --name-only --diff-filter=A "origin/${base_ref}...HEAD" -- 'docs/**/*.md')
          else
            echo "::warning::origin/${base_ref} not available; skipping changelog check."
            added=""
          fi
          status=0
          for f in $added; do
            grep -q '## Documentation changelog' "$f" || { echo "::error::$f is missing a '## Documentation changelog' section"; status=1; }
          done
          exit $status
      - name: Build web application when dependencies are available
        working-directory: webapp
        run: |
          if [ -d node_modules ]; then
            npm run typecheck
          else
            echo "Install webapp dependencies in the frontend job for full typecheck."
          fi
      - name: Validate experimental Bicep reference
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/bicep/main.bicep
      - name: Configure Terraform for the R1 authoritative provider
        uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - name: Validate Databricks bundle when CLI is available
        run: |
          if command -v databricks >/dev/null 2>&1; then
            DATABRICKS_BUNDLE_ROOT=databricks databricks bundle validate -t dev
          else
            echo "Databricks CLI not installed in this local CI pass; deployment workflow validates it."
          fi
